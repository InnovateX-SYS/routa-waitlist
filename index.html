<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/Routa-01.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Routa — All-in-One Travel App | Join the Waitlist</title>
    <meta
      name="description"
      content="Routa is an all-in-one travel app to discover destinations, plan itineraries, and book flights, hotels, cabs & experiences — all in one place. Join the waitlist for early access."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6B6EF5" />
    <link rel="canonical" href="https://www.routa.travel/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Routa" />
    <meta property="og:title" content="Routa — All-in-One Travel App" />
    <meta
      property="og:description"
      content="Discover destinations, plan itineraries, and book flights, hotels, cabs & experiences — all in one place. Join the Routa waitlist for early access."
    />
    <meta property="og:url" content="https://www.routa.travel/" />
    <meta property="og:image" content="https://www.routa.travel/assets/waitlist-h-background.png" />
    <meta property="og:image:alt" content="Routa — everything you need to plan, book and travel" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tryrouta" />
    <meta name="twitter:title" content="Routa — All-in-One Travel App" />
    <meta
      name="twitter:description"
      content="Discover destinations, plan itineraries, and book flights, hotels, cabs & experiences — all in one place. Join the Routa waitlist for early access."
    />
    <meta name="twitter:image" content="https://www.routa.travel/assets/waitlist-h-background.png" />

    <!-- Structured data: helps Google (and AI Overviews) understand the brand -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Routa",
        "url": "https://www.routa.travel/",
        "logo": "https://www.routa.travel/assets/Routa-01.svg",
        "description": "Routa is an all-in-one travel platform to discover destinations, plan itineraries, and book flights, hotels, cabs, and experiences.",
        "sameAs": [
          "https://x.com/tryrouta",
          "https://instagram.com/tryrouta",
          "https://tiktok.com/@tryrouta",
          "https://linkedin.com/company/tryrouta"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Routa",
        "url": "https://www.routa.travel/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
